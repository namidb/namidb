[package]
name = "namidb-bolt"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bolt wire protocol (PackStream + handshake + state machine) for NamiDB"
readme = "README.md"

# async_trait marks each generated trait method #[must_use] on top of the
# already must_use boxed future, which clippy 1.99 reports as double_must_use.
[lints.clippy]
double_must_use = "allow"

[dependencies]
namidb-core = { workspace = true }
namidb-query = { workspace = true }
namidb-storage = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
