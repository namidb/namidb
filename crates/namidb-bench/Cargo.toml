[package]
name = "namidb-bench"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LDBC-shaped synthetic benchmark harness for NamiDB"

[[bin]]
name = "namidb-bench"
path = "src/main.rs"

[features]
default = []
# RFC-030 ANN index bench (`ann-bench`): builds the real Vamana `.vg` and queries
# it through the engine. Off by default so the standard bench build stays light.
vector-index = ["namidb-query/vector-index", "namidb-storage/vector-index"]
# Object-store-native acceptance harness. This deliberately exercises the
# range-readable wire formats directly, without bringing the query executor
# into the measurement.
object-native = ["namidb-storage/vector-index", "namidb-storage/text-index"]
# `serve` + `http-load`: the real HTTP server on a latency-simulating object
# store, and the client that measures write throughput and vector search.
http-load = [
    "dep:namidb-server",
    "dep:reqwest",
    "dep:humantime",
    "dep:tracing-subscriber",
    "namidb-server/vector-index",
    "namidb-server/text-index",
    "namidb-query/vector-index",
    "namidb-query/text-index",
    "namidb-storage/vector-index",
    "namidb-storage/text-index",
]

[dependencies]
namidb-core = { workspace = true }
namidb-storage = { workspace = true }
namidb-query = { workspace = true }
namidb-server = { path = "../namidb-server", optional = true }
reqwest = { workspace = true, optional = true }
humantime = { version = "2", optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
object_store = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
tempfile = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
csv = "1.3"
