# Build the `namidb` CLI and `namidb-mcp` server as prebuilt binaries for
# each supported (OS, arch) and attach them to the GitHub Release, so a user
# can run them without a Rust toolchain.
#
# Triggers:
#   * `v*` tag push      → build per-platform archives + upload to the release.
#   * PR                 → fast debug build-check, no upload.
#   * workflow_dispatch → full release-matrix build/archive/checksum preflight
#                         in dry-run mode, no upload.
#
# The release build inherits the workspace `[profile.release]` (fat LTO,
# codegen-units = 1), so per-target builds are slow but compact. The wheels
# (python-wheels.yml) ship the Python bindings separately; this workflow is
# only the standalone binaries.

name: release-binaries

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "LICENSE"
      - "scripts/check-release-metadata.py"
      - ".github/workflows/release-binaries.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag publication after it may have uploaded some assets.
  # Branch/PR preflights may still supersede an older run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-release:
    name: validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate Cargo, lockfile, changelog, Python metadata, and license
        run: python scripts/check-release-metadata.py
      - name: Validate v* tag against the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release-metadata.py \
            --tag "$RELEASE_TAG" --tag-kind engine

  # Fast debug build to catch binary regressions on PRs without paying for the
  # release LTO build or touching the release. A manual dispatch uses the full
  # release matrix below instead.
  build-check:
    name: build-check
    needs: validate-release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo build --locked --bin namidb --bin namidb-mcp
      # The HTTP server is shipped with vector + text search ON (see the `upload`
      # job), so gate that exact config on PRs — `ci.yml` builds/tests without
      # features, leaving the feature-gated server code otherwise uncovered.
      - run: cargo build --locked -p namidb-server --features vector-index,text-index

  # A manual preflight exercises the exact release profile, target matrix,
  # archive layout, feature set, and checksums without creating a GitHub Release
  # or uploading assets. Run this and docker-image's empty-version dispatch
  # before creating an immutable v* tag.
  preflight-matrix:
    name: preflight · ${{ matrix.target }}
    needs: validate-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and package namidb + namidb-mcp (dry run)
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: namidb,namidb-mcp
          locked: true
          target: ${{ matrix.target }}
          archive: namidb-$tag-$target
          tar: unix
          zip: windows
          include: LICENSE,README.md
          checksum: sha256
          dry-run: true
          dry-run-intended: true
      - name: Build and package namidb-server (dry run)
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: namidb-server
          locked: true
          features: vector-index,text-index
          manifest-path: crates/namidb-server/Cargo.toml
          target: ${{ matrix.target }}
          archive: namidb-server-$tag-$target
          tar: unix
          zip: windows
          include: LICENSE,README.md
          checksum: sha256
          dry-run: true
          dry-run-intended: true
      - name: Verify GNU/Linux glibc baseline
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          MAX_GLIBC=$(
            for BIN in namidb namidb-mcp namidb-server; do
              readelf --version-info "target/${{ matrix.target }}/release/$BIN"
            done |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' |
              sed 's/^GLIBC_//' |
              sort -Vu |
              tail -1
          )
          test -n "$MAX_GLIBC"
          if [[ "$(printf '%s\n' "$MAX_GLIBC" 2.35 | sort -V | tail -1)" != "2.35" ]]; then
            echo "::error::GNU/Linux archive requires GLIBC_$MAX_GLIBC; maximum supported baseline is GLIBC_2.35"
            exit 1
          fi
          echo "GNU/Linux archive baseline ok: GLIBC_$MAX_GLIBC <= GLIBC_2.35"

  # On a `v*` tag: create a draft before the matrix uploads. The final job
  # publishes it only after every platform succeeds, so users never see a
  # partially populated release after one target fails.
  create-release:
    needs: validate-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create a private draft for this immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT=$(
              gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'
            )
            test "$IS_DRAFT" = "true" || {
              echo "::error::Refusing to mutate an already-public release"
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  # On a `v*` tag: build release archives per platform and upload to the
  # release created above.
  upload:
    name: upload · ${{ matrix.target }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          # Match the x86_64 glibc baseline. Building natively on 24.04 linked
          # the nominally generic GNU archive against GLIBC_2.39.
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and upload namidb + namidb-mcp
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: namidb,namidb-mcp
          locked: true
          target: ${{ matrix.target }}
          archive: namidb-$tag-$target
          tar: unix
          zip: windows
          include: LICENSE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      # The HTTP server, built WITH vector + text search so `CREATE VECTOR INDEX`
      # / `CREATE FULLTEXT INDEX` and index-backed KNN/BM25 work out of the box.
      # A separate step: `features:` applies to every bin in a step's build, and
      # namidb/namidb-mcp do not define these features. `manifest-path` pins the
      # crate so `--features` resolves unambiguously; the distinct `archive` name
      # avoids clobbering the CLI archive above.
      - name: Build and upload namidb-server (vector + text index)
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: namidb-server
          locked: true
          features: vector-index,text-index
          manifest-path: crates/namidb-server/Cargo.toml
          target: ${{ matrix.target }}
          archive: namidb-server-$tag-$target
          tar: unix
          zip: windows
          include: LICENSE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify GNU/Linux glibc baseline before finalizing the draft
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          MAX_GLIBC=$(
            for BIN in namidb namidb-mcp namidb-server; do
              readelf --version-info "target/${{ matrix.target }}/release/$BIN"
            done |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' |
              sed 's/^GLIBC_//' |
              sort -Vu |
              tail -1
          )
          test -n "$MAX_GLIBC"
          if [[ "$(printf '%s\n' "$MAX_GLIBC" 2.35 | sort -V | tail -1)" != "2.35" ]]; then
            echo "::error::GNU/Linux archive requires GLIBC_$MAX_GLIBC; maximum supported baseline is GLIBC_2.35"
            exit 1
          fi
          echo "GNU/Linux archive baseline ok: GLIBC_$MAX_GLIBC <= GLIBC_2.35"

  finalize-release:
    name: publish complete release
    needs: upload
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Verify the complete private release and every checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'
          )" = "true"

          RELEASE_DIR=$(mktemp -d)
          trap 'rm -rf "$RELEASE_DIR"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$RELEASE_DIR"

          TARGETS=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          PREFIXES=(namidb namidb-server)
          for TARGET in "${TARGETS[@]}"; do
            EXT=tar.gz
            if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
              EXT=zip
            fi
            for PREFIX in "${PREFIXES[@]}"; do
              ARCHIVE="$PREFIX-$GITHUB_REF_NAME-$TARGET.$EXT"
              test -s "$RELEASE_DIR/$ARCHIVE"
              test -s "$RELEASE_DIR/$PREFIX-$GITHUB_REF_NAME-$TARGET.sha256"
            done
          done

          mapfile -t ASSETS < <(find "$RELEASE_DIR" -maxdepth 1 -type f -printf '%f\n')
          test "${#ASSETS[@]}" -eq 16
          (
            cd "$RELEASE_DIR"
            sha256sum --strict -c ./*.sha256
          )

      - name: Publish the fully populated draft (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
