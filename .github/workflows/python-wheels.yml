# Build the namidb Python wheel for every supported (OS, arch) tuple,
# build the sdist, smoke-test the resulting wheel, and (on tag push)
# publish to PyPI using OIDC trusted publishing.
#
# abi3-py39 means **one wheel per (OS, arch)** covers Python 3.9
# through 3.13+ — no Python-version matrix needed.
#
# Triggers:
#   * `py-v*` tag push  → build all wheels + sdist + publish.
#   * `workflow_dispatch`   → manual run (build + smoke, no publish).
#   * PR / push to main / changes to the bindings crate → smoke
#                              build to catch regressions early.
#
# PyPI setup (one-time, manual on pypi.org):
#   1. Create the `namidb` project on PyPI (or claim the existing one).
#   2. Settings → Publishing → "Add a new pending publisher" with:
#        owner = namidb, repo = namidb,
#        workflow = python-wheels.yml,
#        environment = pypi
#   3. After the first successful publish, the publisher becomes
#      "trusted" and tagged releases auto-upload.
#
# Tagging convention: `py-v0.1.0`, `py-v0.2.0-rc1`, etc. The validation
# job rejects the release before any wheel is built unless the tag, Cargo
# workspace, lockfile, internal path-dependency pins, pyproject version, and
# dated changelog entry all agree exactly.

name: python-wheels

on:
  push:
    tags:
      - "py-v*"
    branches: [main]
    paths:
      - "crates/namidb-py/**"
      - "crates/namidb-core/**"
      - "crates/namidb-storage/**"
      - "crates/namidb-ann/**"
      - "crates/namidb-graph/**"
      - "crates/namidb-query/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".gitattributes"
      - "scripts/check-release-metadata.py"
      - ".github/workflows/python-wheels.yml"
  pull_request:
    paths:
      - "crates/namidb-py/**"
      - "crates/namidb-core/**"
      - "crates/namidb-storage/**"
      - "crates/namidb-ann/**"
      - "crates/namidb-graph/**"
      - "crates/namidb-query/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".gitattributes"
      - "scripts/check-release-metadata.py"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch: {}

# Cancel in-progress runs of the same branch / PR so tag pushes
# always race to the head. A tag publication queues instead of cancelling once
# an upload may have started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate-release:
    name: validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate Cargo, lockfile, changelog, Python metadata, and license
        run: python scripts/check-release-metadata.py
      - name: Validate py-v* tag against the declared version
        if: startsWith(github.ref, 'refs/tags/py-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release-metadata.py \
            --tag "$RELEASE_TAG" --tag-kind python

  # ── Wheels (one per OS × arch — abi3-py39 covers every CPython >= 3.9) ─
  build-wheels:
    name: wheel · ${{ matrix.target.os }} · ${{ matrix.target.arch }}
    needs: validate-release
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux,   arch: x86_64,  rust_target: x86_64-unknown-linux-gnu,    runner: ubuntu-22.04, manylinux: "2_28" }
          - { os: linux,   arch: aarch64, rust_target: aarch64-unknown-linux-gnu,   runner: ubuntu-22.04, manylinux: "2_28" }
          # macOS x86_64 (Intel) is intentionally not built: GitHub's
          # `macos-13` runners are scarce and Intel Macs are <20 % of
          # the Python install base on macOS. Users on Intel Macs fall
          # back to the sdist.
          - { os: macos,   arch: arm64,   rust_target: aarch64-apple-darwin,        runner: macos-14,     manylinux: "" }
          - { os: windows, arch: x86_64,  rust_target: x86_64-pc-windows-msvc,      runner: windows-2022, manylinux: "" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build wheel via maturin-action
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target.rust_target }}
          args: --locked --release --out dist --manifest-path crates/namidb-py/Cargo.toml
          manylinux: ${{ matrix.target.manylinux }}
          sccache: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  # ── Source distribution (single platform-independent build) ────────────
  build-sdist:
    name: sdist
    needs: validate-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build sdist via maturin-action
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          # maturin 1.14 removed `--locked` from the `sdist` subcommand (there
          # is no Cargo build in this path). The preceding release validator
          # checks the workspace lockfile and every internal version pin.
          args: --out dist --manifest-path crates/namidb-py/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  verify-distributions:
    name: verify wheel/sdist metadata
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist
      - name: Verify artifact count, version, and bundled license
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(
            python - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("crates/namidb-py/pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )

          mapfile -t WHEELS < <(find dist -maxdepth 1 -type f -name '*.whl' -print | sort)
          mapfile -t SDISTS < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#WHEELS[@]}" -eq 4
          test "${#SDISTS[@]}" -eq 1

          for WHEEL in "${WHEELS[@]}"; do
            unzip -p "$WHEEL" '*/METADATA' |
              grep -Fx "Version: $EXPECTED_VERSION"
            unzip -p "$WHEEL" '*/METADATA' |
              grep -Fx "License-Expression: BUSL-1.1"
            unzip -p "$WHEEL" '*/METADATA' |
              grep -Fx "License-File: LICENSE"
            unzip -p "$WHEEL" '*/licenses/LICENSE' | cmp - LICENSE
          done

          SDIST="${SDISTS[0]}"
          PKG_INFO=$(tar -tzf "$SDIST" | grep -E '^[^/]+/PKG-INFO$')
          LICENSE_PATH=$(tar -tzf "$SDIST" | grep -E '^[^/]+/LICENSE$')
          tar -xOf "$SDIST" "$PKG_INFO" |
            grep -Fx "Version: $EXPECTED_VERSION"
          tar -xOf "$SDIST" "$PKG_INFO" |
            grep -Fx "License-Expression: BUSL-1.1"
          tar -xOf "$SDIST" "$PKG_INFO" |
            grep -Fx "License-File: LICENSE"
          tar -xOf "$SDIST" "$LICENSE_PATH" | cmp - LICENSE

  # ── Smoke test: install one of the built wheels and import namidb ──────
  smoke-test:
    name: smoke · ${{ matrix.os }} · py${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.9",  artifact: wheel-linux-x86_64 }
          - { os: ubuntu-22.04, python: "3.13", artifact: wheel-linux-x86_64 }
          - { os: macos-14,     python: "3.12", artifact: wheel-macos-arm64 }
          - { os: windows-2022, python: "3.12", artifact: wheel-windows-x86_64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the freshly-built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the LOCAL wheel by path, not by name. A bare
          # `pip install namidb` (even with --find-links) can resolve to the
          # PUBLISHED PyPI wheel of the same version and silently test that
          # instead of this build — masking any new API in the PR.
          # Installing the file directly forces the local artifact; deps (e.g.
          # pyarrow) still resolve from PyPI since the index stays enabled.
          python -m pip install dist/*.whl
      - name: Smoke (import + Client roundtrip)
        shell: bash
        run: |
          python - <<'PY'
          import namidb as tg
          assert isinstance(tg.__version__, str)
          c = tg.Client("memory://ci-smoke")
          c.cypher("CREATE (a:Person {name: 'CI'})")
          r = c.cypher("MATCH (p:Person) RETURN p.name AS name")
          assert r.first() == {"name": "CI"}, r.first()
          c.cypher(
              "CREATE VECTOR INDEX ci_vec ON :Doc(embedding) "
              "METRIC cosine DIMENSION 3"
          )
          c.cypher("CREATE FULLTEXT INDEX ci_text ON :Doc(body)")
          indexes = {row["name"]: row for row in c.cypher("SHOW INDEXES").rows()}
          assert indexes["ci_vec"]["type"] == "VECTOR", indexes
          assert indexes["ci_text"]["type"] == "FULLTEXT", indexes
          print("ok:", tg.__version__)
          PY
      - name: Pytest the package against the installed wheel
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # polars 1.41.x SIGABRTs on the macos-14 / py3.12 runner during the
          # async cypher test (1.40.1 was fine on 2026-05-27); cap below 1.41
          # until the upstream regression clears. pip still picks the best
          # 1.40.x per (OS, python) in the matrix.
          python -m pip install pytest pytest-asyncio pandas 'polars<1.41'
          python -m pytest crates/namidb-py/tests -v

  # ── PyPI publish (only on tag push, OIDC trusted publisher) ────────────
  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist, verify-distributions, smoke-test]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/py-v')
    environment:
      name: pypi
      url: https://pypi.org/p/namidb
    permissions:
      id-token: write   # OIDC — no token secret required
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspect what will be uploaded
        run: ls -lh dist

      - name: Reject non-identical pre-existing PyPI files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"].removeprefix("py-v")
          artifacts = [
              path
              for path in pathlib.Path("dist").iterdir()
              if path.is_file()
              and (path.suffix == ".whl" or path.name.endswith(".tar.gz"))
          ]
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }
          if len(local) != 5:
              raise SystemExit(f"expected 5 local distributions, found {sorted(local)}")

          request = urllib.request.Request(
              f"https://pypi.org/pypi/namidb/{version}/json",
              headers={"User-Agent": "namidb-release-verifier/1"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              payload = {"urls": []}

          remote = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload["urls"]
          }
          unexpected = sorted(remote.keys() - local.keys())
          mismatched = sorted(
              name for name in remote.keys() & local.keys()
              if remote[name] != local[name]
          )
          if unexpected or mismatched:
              raise SystemExit(
                  "PyPI collision: "
                  f"unexpected={unexpected}, hash_mismatch={mismatched}"
              )
          print(
              f"PyPI preflight ok: {len(remote)}/5 byte-identical files "
              "already present"
          )
          PY

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          # Trusted Publishing signs and uploads one PEP 740 Sigstore
          # attestation per wheel/sdist. Keep this explicit so a future action
          # default cannot silently weaken the release.
          attestations: true
          packages-dir: dist
          skip-existing: true
          verify-metadata: true

      - name: Verify the complete immutable PyPI release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"].removeprefix("py-v")
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("dist").iterdir()
              if path.is_file()
              and (path.suffix == ".whl" or path.name.endswith(".tar.gz"))
          }
          deadline = time.monotonic() + 180
          url = f"https://pypi.org/pypi/namidb/{version}/json"
          while True:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "namidb-release-verifier/1"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  # PyPI accepted every upload before returning, but its JSON
                  # endpoint may lag briefly. Treat an initial 404 exactly like
                  # an empty/incomplete release and keep polling until the
                  # deadline instead of failing the successful publication.
                  payload = {"urls": []}
              remote = {
                  item["filename"]: item["digests"]["sha256"]
                  for item in payload["urls"]
              }
              if remote == local:
                  print("PyPI release verified: exactly 5 byte-identical files")
                  break

              unexpected = sorted(remote.keys() - local.keys())
              mismatched = sorted(
                  name for name in remote.keys() & local.keys()
                  if remote[name] != local[name]
              )
              if unexpected or mismatched:
                  raise SystemExit(
                      "PyPI verification failed: "
                      f"unexpected={unexpected}, hash_mismatch={mismatched}"
                  )
              if time.monotonic() >= deadline:
                  missing = sorted(local.keys() - remote.keys())
                  raise SystemExit(
                      f"PyPI did not expose the complete release: missing={missing}"
                  )
              time.sleep(10)
          PY
