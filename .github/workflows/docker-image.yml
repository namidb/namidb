# Build and publish the official `namidb-server` container image.
#
# Triggers:
#   * `v*` tag push          → build linux/amd64 + linux/arm64 (each on its
#                              native runner — no QEMU) and push to GHCR
#                              and Docker Hub (credentials are mandatory)
#                              tagged `X.Y.Z`, `X.Y`, `X` and `latest`.
#   * workflow_dispatch      → with a `version` input (e.g. `2.0.0`): checks out
#                              tag `v<version>` and publishes only that immutable
#                              version — for releases that predate this workflow.
#                              Historical dispatches never move rolling tags.
#                              Without the input: build-check only.
#   * pull_request           → build-check on both arches, no push, so a broken
#                              Dockerfile is caught before the release tag.
#
# The image is the same config as the prebuilt `namidb-server` release
# archive: `--features vector-index,text-index` (see the Dockerfile).
#
# Shape: one `build` job per arch pushes the image *by digest*, then `publish`
# stitches the digests into one multi-arch manifest per tag. A fat-LTO Rust
# build under QEMU takes hours; native `ubuntu-24.04-arm` runners take minutes.
#
# Registries:
#   ghcr.io/namidb/namidb-server     — always (GITHUB_TOKEN, zero config)
#   docker.io/namidb/namidb-server   — required for an official publish,
#                                      because Compose and the public install
#                                      instructions consume this repository.

name: docker-image

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "crates/**"
      - "docker-compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "LICENSE"
      - "scripts/check-release-metadata.py"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Historical version to publish (e.g. 2.0.0) — checks out tag v<version> and pushes only that immutable tag. Empty = build-check only."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A second immutable-tag publication must queue, never cancel a run that may
  # already have pushed one architecture. Branch/PR preflights may supersede.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

env:
  # The Docker Hub username is a repo *variable*, not a secret: as a secret
  # its value ("namidb") gets masked across every log line and GitHub drops
  # job outputs containing it. Only DOCKERHUB_TOKEN is a secret.
  HAS_DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' }}

jobs:
  # Decide once: are we publishing and which version. Image repository names
  # are deliberately NOT job outputs: GitHub silently drops any job output
  # containing a secret value ("skip output since it may contain secret"),
  # which bit us when DOCKERHUB_USERNAME ("namidb") was stored as a secret —
  # every job composes the repo list locally from HAS_DOCKERHUB instead.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.compute.outputs.publish }}
      version: ${{ steps.compute.outputs.version }}
      ref: ${{ steps.compute.outputs.ref }}
      rolling_tags: ${{ steps.compute.outputs.rolling_tags }}
    steps:
      - name: Compute version and tags
        id: compute
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUBLISH=false PROMOTE_ROLLING=false VERSION="" REF="$GITHUB_REF"
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              PUBLISH=true
              PROMOTE_ROLLING=true
              ;;
          esac
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"; PUBLISH=true; REF="refs/tags/v$VERSION"
            # A historical/manual republish must never roll `latest`, `X`, or
            # `X.Y` backwards. Only the immutable version is reconstructed.
            PROMOTE_ROLLING=false
          fi

          ROLLING_TAGS=""
          # Rolling tags belong only to a new stable tag push. They are
          # promoted after both registries' immutable manifests validate.
          if [[ "$PROMOTE_ROLLING" == "true" \
            && "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            ROLLING_TAGS="${BASH_REMATCH[1]}.${BASH_REMATCH[2]} ${BASH_REMATCH[1]} latest"
          fi

          {
            echo "publish=$PUBLISH"
            echo "version=$VERSION"
            echo "ref=$REF"
            echo "rolling_tags=$ROLLING_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH version=$VERSION rolling_tags=[$ROLLING_TAGS]"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.compute.outputs.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release metadata
        env:
          PUBLISH: ${{ steps.compute.outputs.publish }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -f scripts/check-release-metadata.py ]]; then
            python scripts/check-release-metadata.py
            if [[ "$PUBLISH" == "true" ]]; then
              python scripts/check-release-metadata.py \
                --tag "v$VERSION" --tag-kind engine
            fi
          elif [[ "$PUBLISH" == "true" ]]; then
            # Compatibility path for manually publishing a historical tag
            # created before the shared validator existed.
            python - "$VERSION" <<'PY'
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          with pathlib.Path("Cargo.toml").open("rb") as handle:
              cargo = str(tomllib.load(handle)["workspace"]["package"]["version"])
          with pathlib.Path("crates/namidb-py/pyproject.toml").open("rb") as handle:
              python = str(tomllib.load(handle)["project"]["version"])
          if cargo != expected or python != expected:
              raise SystemExit(
                  f"release metadata mismatch: tag={expected}, "
                  f"Cargo={cargo}, Python={python}"
              )
          print(f"historical release metadata ok: version={expected}")
          PY
          fi

      - name: Require official Docker Hub publication credentials
        if: steps.compute.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

  # One native build per architecture. When publishing, the image is pushed
  # *by digest* to every target repository; tags are attached in `publish`.
  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: Resolve image source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.meta.outputs.publish == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose by-digest output spec
        id: out
        run: |
          set -euo pipefail
          if [[ "${{ needs.meta.outputs.publish }}" == "true" ]]; then
            NAMES="ghcr.io/namidb/namidb-server"
            if [[ "$HAS_DOCKERHUB" == "true" ]]; then
              NAMES="$NAMES,docker.io/namidb/namidb-server"
            fi
            echo "outputs=type=image,\"name=$NAMES\",push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "outputs=type=cacheonly" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: crates/namidb-server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NAMIDB_VERSION=${{ needs.meta.outputs.version || 'dev' }}
            NAMIDB_REVISION=${{ steps.source.outputs.revision }}
          outputs: ${{ steps.out.outputs.outputs }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Export digest
        if: needs.meta.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.meta.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest per tag, in each
  # target repository.
  publish:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish immutable manifests, verify both registries, then promote rolling tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING_TAGS_TEXT: ${{ needs.meta.outputs.rolling_tags }}
        run: |
          set -euo pipefail

          mapfile -t DIGESTS < <(
            find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort
          )
          test "${#DIGESTS[@]}" -eq 2

          IMAGES=(ghcr.io/namidb/namidb-server)
          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            IMAGES+=(docker.io/namidb/namidb-server)
          fi

          # Phase 1: create only the immutable version in every registry. No
          # rolling tag moves until both copies have the required platforms and
          # identical child digests.
          for IMG in "${IMAGES[@]}"; do
            SRCS=()
            for D in "${DIGESTS[@]}"; do
              SRCS+=("$IMG@sha256:$D")
            done
            docker buildx imagetools create -t "$IMG:$VERSION" "${SRCS[@]}"
          done

          EXPECTED_DIGESTS=""
          for IMG in "${IMAGES[@]}"; do
            docker buildx imagetools inspect "$IMG:$VERSION"
            PLATFORMS=$(
              docker buildx imagetools inspect --raw "$IMG:$VERSION" |
                jq -c '[.manifests[].platform |
                  select(.os == "linux") |
                  "\(.os)/\(.architecture)"] | sort'
            )
            test "$PLATFORMS" = '["linux/amd64","linux/arm64"]'

            VERSION_DIGESTS=$(
              docker buildx imagetools inspect --raw "$IMG:$VERSION" |
                jq -cS '[.manifests[].digest] | sort'
            )
            if [[ -z "$EXPECTED_DIGESTS" ]]; then
              EXPECTED_DIGESTS="$VERSION_DIGESTS"
            else
              test "$VERSION_DIGESTS" = "$EXPECTED_DIGESTS"
            fi
          done

          # Phase 2: only a fresh stable tag push promotes rolling aliases.
          # A historical workflow_dispatch intentionally leaves them alone.
          ROLLING_TAGS=()
          if [[ -n "$ROLLING_TAGS_TEXT" ]]; then
            read -r -a ROLLING_TAGS <<< "$ROLLING_TAGS_TEXT"
          fi
          for IMG in "${IMAGES[@]}"; do
            for TAG in "${ROLLING_TAGS[@]}"; do
              docker buildx imagetools create -t "$IMG:$TAG" "$IMG:$VERSION"
            done
          done

          # Verify every promoted alias in both registries after promotion.
          for IMG in "${IMAGES[@]}"; do
            for TAG in "${ROLLING_TAGS[@]}"; do
              TAG_DIGESTS=$(
                docker buildx imagetools inspect --raw "$IMG:$TAG" |
                  jq -cS '[.manifests[].digest] | sort'
              )
              test "$TAG_DIGESTS" = "$EXPECTED_DIGESTS"
            done
          done
