# Self-hosted NamiDB on MinIO.
#
# Usage (pulls the official image from Docker Hub, nothing to build):
#   export NAMIDB_AUTH_TOKEN=$(openssl rand -hex 32)
#   docker compose up -d
#   curl -s http://localhost:8080/v0/health | jq .
#
# To run a locally built image instead:
#   docker build -t namidb/namidb-server:2 -f crates/namidb-server/Dockerfile .
#
# After it boots, the graph database is reachable on :8080 with bearer
# token = $NAMIDB_AUTH_TOKEN. The MinIO console is on :9001
# (login: minioadmin / minioadmin).

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 30

  bucket-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/namidb
      "

  namidb-server:
    image: namidb/namidb-server:2
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      NAMIDB_STORE: "s3://namidb?ns=prod&endpoint=http://minio:9000&region=us-east-1&allow_http=true"
      NAMIDB_LISTEN: "0.0.0.0:8080"
      NAMIDB_AUTH_TOKEN: "${NAMIDB_AUTH_TOKEN:?set NAMIDB_AUTH_TOKEN in your env (e.g. openssl rand -hex 32)}"
      NAMIDB_FLUSH_INTERVAL: "30s"
      NAMIDB_CACHE_MAX_BYTES: "${NAMIDB_CACHE_MAX_BYTES:-1073741824}"
      # One active query/snapshot may retain at most this many decoded node
      # views outside the process-wide shared-cache pool.
      NAMIDB_SNAPSHOT_NODE_CACHE_MAX_BYTES: "${NAMIDB_SNAPSHOT_NODE_CACHE_MAX_BYTES:-1048576}"
      NAMIDB_SNAPSHOT_ROW_GROUP_CACHE_MAX_BYTES: "${NAMIDB_SNAPSHOT_ROW_GROUP_CACHE_MAX_BYTES:-1048576}"
      NAMIDB_SNAPSHOT_EDGE_READER_CACHE_MAX_BYTES: "${NAMIDB_SNAPSHOT_EDGE_READER_CACHE_MAX_BYTES:-1048576}"
      # Optional exact-byte reservation carved out of CACHE_MAX for the shared
      # decoded .vg/.ft pool. Empty keeps proportional legacy allocation.
      NAMIDB_SEARCH_INDEX_CACHE_MAX_BYTES: "${NAMIDB_SEARCH_INDEX_CACHE_MAX_BYTES:-}"
      # Object-store-native graph/vector/FTS pages retain a small bounded RAM
      # tier and a reconstructible persistent NVMe tier. The latter is cache,
      # never the source of truth; deleting the volume only makes reads cold.
      NAMIDB_RAM_PAGE_CACHE_MAX_BYTES: "${NAMIDB_RAM_PAGE_CACHE_MAX_BYTES:-67108864}"
      NAMIDB_NVME_CACHE_PATH: "/var/cache/namidb-ranges"
      NAMIDB_NVME_CACHE_MAX_BYTES: "${NAMIDB_NVME_CACHE_MAX_BYTES:-10737418240}"
      NAMIDB_RANGE_CACHE_NAMESPACE: "${NAMIDB_RANGE_CACHE_NAMESPACE:-compose-minio-prod}"
      NAMIDB_SEARCH_WORKSPACE_MAX_BYTES: "${NAMIDB_SEARCH_WORKSPACE_MAX_BYTES:-268435456}"
      NAMIDB_SEARCH_MAX_RESULT_BYTES: "${NAMIDB_SEARCH_MAX_RESULT_BYTES:-67108864}"
      NAMIDB_BM25_MAX_DOCUMENT_BYTES: "${NAMIDB_BM25_MAX_DOCUMENT_BYTES:-1048576}"
      # `auto` admits work only up to 90% of the finite cgroup limit below,
      # leaving kernel/OOM headroom for allocations already in flight.
      NAMIDB_MEMORY_MAX_BYTES: "${NAMIDB_MEMORY_MAX_BYTES:-auto}"
      # Exact-record sidecars spool large value regions to disk during
      # flush/compaction instead of retaining several GiB in process RSS.
      # Vector and FTS builders use the same volume and a separately bounded
      # logical sort/partition buffer.
      NAMIDB_SPOOL_DIR: "/var/tmp/namidb-spool"
      NAMIDB_INDEX_BUILD_SPOOL_DIR: "/var/tmp/namidb-spool"
      NAMIDB_INDEX_BUILD_MEMORY_BYTES: "${NAMIDB_INDEX_BUILD_MEMORY_BYTES:-268435456}"
      NAMIDB_SIDECAR_SORT_MEMORY_BYTES: "${NAMIDB_SIDECAR_SORT_MEMORY_BYTES:-8388608}"
      # Disabled by default: current readers use PagedV2 directly. Set a
      # positive bounded value only during an explicit old-reader migration.
      NAMIDB_LEGACY_PROPERTY_INDEX_MAX_BYTES: "${NAMIDB_LEGACY_PROPERTY_INDEX_MAX_BYTES:-0}"
      NAMIDB_VECTOR_FILTER_MAX_DISTINCT: "${NAMIDB_VECTOR_FILTER_MAX_DISTINCT:-4096}"
      NAMIDB_VECTOR_FILTER_MAX_BYTES: "${NAMIDB_VECTOR_FILTER_MAX_BYTES:-67108864}"
      NAMIDB_VECTOR_FILTER_ID_CANDIDATE_CAP: "${NAMIDB_VECTOR_FILTER_ID_CANDIDATE_CAP:-8192}"
      NAMIDB_HYBRID_TEXT_FILTER_CANDIDATE_CAP: "${NAMIDB_HYBRID_TEXT_FILTER_CANDIDATE_CAP:-65536}"
      # Zero means "no artificial output cap". Positive operator caps fail
      # flush/compaction explicitly; they never make an SST silently lose its
      # exact-edge accelerator and regress MERGE back to an adjacency scan.
      NAMIDB_EDGE_POINT_MAX_ENTRY_BYTES: "${NAMIDB_EDGE_POINT_MAX_ENTRY_BYTES:-0}"
      NAMIDB_EDGE_POINT_MAX_SST_BYTES: "${NAMIDB_EDGE_POINT_MAX_SST_BYTES:-0}"
      NAMIDB_EDGE_DECODE_MAX_BYTES: "${NAMIDB_EDGE_DECODE_MAX_BYTES:-67108864}"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      RUST_LOG: "info"
    ports:
      - "8080:8080"
    # Hard containment is enabled in the production example instead of
    # relying on cache accounting alone. Override deliberately for larger
    # search/build workspaces; `NAMIDB_MEMORY_MAX_BYTES=auto` follows it.
    mem_limit: "${NAMIDB_CONTAINER_MEMORY_LIMIT:-4g}"
    volumes:
      - namidb-spool:/var/tmp/namidb-spool
      - namidb-range-cache:/var/cache/namidb-ranges

volumes:
  minio-data: {}
  namidb-spool: {}
  namidb-range-cache: {}
